    <script>
        /**
         * =========================================================================
         * 1. HỆ THỐNG CHUẨN HÓA & RENDER CÔNG THỨC KATEX TOÀN DIỆN
         * Khắc phục triệt để lỗi ký hiệu như $v = \frac{s}{t}$ hay mất dấu '\'
         * =========================================================================
         */
        function fixLatex(str) {
            if (typeof str !== 'string') return str;
            // Phục hồi các ký tự control JS vô tình nuốt dấu '\' nếu có
            let s = str
                .replace(/\x0c/g, '\\f') // form feed -> \f (\frac)
                .replace(/\t/g, '\\t')   // tab -> \t (\times, \text, \theta)
                .replace(/\x08/g, '\\b') // backspace -> \b (\beta)
                .replace(/\r/g, '\\r');  // carriage return -> \r (\rho, \rightarrow)

            // Đảm bảo các lệnh LaTeX phổ biến bên trong $...$ luôn có dấu \ đứng trước
            s = s.replace(/\$([^$]+)\$/g, (match, expr) => {
                const fixedExpr = expr.replace(
                    /(^|[^\\a-zA-Z])(frac|dfrac|tfrac|sqrt|times|cdot|div|pm|approx|neq|leq|geq|le|ge|Delta|Omega|omega|alpha|beta|gamma|theta|lambda|mu|rho|pi|circ|text|mathrm|mathcal|overrightarrow|vec|left|right|sin|cos|tan)\b/g,
                    '$1\\$2'
                );
                return `$${fixedExpr}$`;
            });
            return s;
        }

        function renderAllMath(container = document.body) {
            if (!container) return;

            // Quét toàn bộ text node chứa '$' để chuẩn hóa cú pháp trước khi gọi KaTeX
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
            const nodesToFix = [];
            let currentNode;
            while ((currentNode = walker.nextNode())) {
                const parentTag = currentNode.parentElement ? currentNode.parentElement.tagName : '';
                if (['SCRIPT', 'STYLE', 'TEXTAREA', 'CODE', 'PRE'].includes(parentTag)) continue;
                if (currentNode.nodeValue && currentNode.nodeValue.includes('$')) {
                    nodesToFix.push(currentNode);
                }
            }

            nodesToFix.forEach(node => {
                const cleaned = fixLatex(node.nodeValue);
                if (cleaned !== node.nodeValue) {
                    node.nodeValue = cleaned;
                }
            });

            // Gọi KaTeX auto-render
            if (typeof window.renderMathInElement === 'function') {
                try {
                    window.renderMathInElement(container, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false },
                            { left: '\\(', right: '\\)', display: false },
                            { left: '\\[', right: '\\]', display: true }
                        ],
                        throwOnError: false,
                        strict: false,
                        trust: true
                    });
                } catch (e) {
                    console.warn('KaTeX render warning:', e);
                }
            }
        }

        // Theo dõi tự động mọi thay đổi DOM để render KaTeX tức thì
        let mathDebounce = null;
        const domMathObserver = new MutationObserver((mutations) => {
            let needsRender = false;
            for (const m of mutations) {
                if (m.addedNodes && m.addedNodes.length > 0) {
                    for (const n of m.addedNodes) {
                        if (n.nodeType === 1 && !n.classList.contains('katex') && !n.classList.contains('katex-display')) {
                            needsRender = true;
                            break;
                        }
                    }
                }
                if (needsRender) break;
            }
            if (needsRender) {
                clearTimeout(mathDebounce);
                mathDebounce = setTimeout(() => renderAllMath(document.body), 20);
            }
        });

        function buildQuizBank(lesson) {
            const bank = [];
            // Đưa các câu hỏi gốc của bài học vào trước
            (lesson.calcTemplates || []).forEach(q => bank.push({ ...q, tag: "Tính toán" }));
            (lesson.customMCQs || []).forEach(q => bank.push({ ...q, tag: "Vận dụng" }));

            // Sinh thêm các câu hỏi luyện tập chuẩn kiến thức từ nội dung lý thuyết và công thức bài học
            const extraPool = generateTopicQuestions(lesson);
            for (const item of extraPool) {
                if (bank.length >= 20) break;
                bank.push(item);
            }
            return bank.slice(0, 20);
        }

        function buildNumericVariants(lessonId) {
            const v = [];
            const add = (q, opts, ans, exp) => v.push({ q, options: opts, ans, exp, tag: "Tính toán" });

            switch (lessonId) {
                case "l6-5":

        const STORAGE_KEY = 'vatly_thcs_kntt_progress_v2';

                    appState.completedLessons = parsed.completedLessons || {};
                    appState.quizAnswers = parsed.quizAnswers || {};
                    appState.quizSubmitted = parsed.quizSubmitted || {};
                }

            try {

                    quizAnswers: appState.quizAnswers,

                });
            });
            return all;

            if (!box) return;
            icon.className = `fa-solid ${iconClass} text-lg`;

                    title: "Mô phỏng Thí nghiệm Định luật Ohm (I = U / R)",
                    desc: "Thay đổi hiệu điện thế U (V) và giá trị điện trở R (Ω) để đọc số chỉ Ampe kế, Vôn kế và công suất tiêu thụ P = U.I.",
                    controls: [
                        { id: "ohmU", label: "Hiệu điện thế U (V)", min: 0, max: 24, step: 2, val: 12 },
                        { id: "ohmR", label: "Điện trở R (Ω)", min: 5, max: 50, step: 5, val: 20 }
                    ]
                },
                em_induction: {
                    title: "Mô phỏng Hiện tượng Cảm ứng điện từ & Dòng điện xoay chiều",
                    desc: "Thay đổi tốc độ quay của khung dây trong từ trường nam châm để quan sát kim điện kế dao động tạo dòng điện xoay chiều.",
                    controls: [
                        { id: "rpm", label: "Tốc độ quay khung dây", min: 0, max: 5, step: 0.5, val: 2 }
                    ]
                }
            };
            return configs[simType] || configs.speed_motion;
        }

        function renderSimulationTab(lesson) {
            const cfg = getSimConfig(lesson.simType);
            // Khởi tạo giá trị mặc định cho simParams
            simParams = {};
            cfg.controls.forEach(c => { simParams[c.id] = c.val; });

            return `
                <div class="bg-white rounded-3xl border border-slate-200/90 shadow-sm p-5 sm:p-7">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                        <div>
                            <h2 class="text-lg sm:text-xl font-extrabold text-slate-900">${cfg.title}</h2>
                            <p class="text-xs sm:text-sm text-slate-600 mt-1">${cfg.desc}</p>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="toggleSimPlay()" id="sim-play-btn" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-sm transition-all">
                                <i class="fa-solid fa-pause mr-1"></i>Tạm dừng
                            </button>
                            <button onclick="resetSimulation()" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-all">
                                <i class="fa-solid fa-rotate-right mr-1"></i>Đặt lại
                            </button>
                        </div>
                    </div>

                    <!-- Khung Canvas Responsive -->
                    <div class="w-full rounded-2xl overflow-hidden border border-slate-200 bg-slate-900 shadow-inner mb-5">
                        <canvas id="physics-sim-canvas" class="w-full block" style="height: 340px;"></canvas>
                    </div>

                    <!-- Bảng điều khiển thông số -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200/80">
                        ${cfg.controls.map(ctrl => `
                            <div>
                                <div class="flex items-center justify-between text-xs sm:text-sm font-semibold text-slate-700 mb-1.5">
                                    <span>${ctrl.label}</span>
                                    <span id="val-${ctrl.id}" class="px-2.5 py-0.5 rounded-lg bg-blue-100 text-blue-800 font-bold">${ctrl.val}</span>
                                </div>
                                <input type="range" id="ctrl-${ctrl.id}" min="${ctrl.min}" max="${ctrl.max}" step="${ctrl.step}" value="${ctrl.val}"
                                    oninput="updateSimParam('${ctrl.id}', this.value)"
                                    class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function updateSimParam(id, val) {
            simParams[id] = parseFloat(val);
            const badge = document.getElementById(`val-${id}`);
            if (badge) badge.textContent = val;
        }

        function toggleSimPlay() {
            simRunning = !simRunning;
            const btn = document.getElementById('sim-play-btn');
            if (btn) {
                btn.innerHTML = simRunning
                    ? '<i class="fa-solid fa-pause mr-1"></i>Tạm dừng'
                    : '<i class="fa-solid fa-play mr-1"></i>Tiếp tục';
            }
        }

        function resetSimulation() {
            simTime = 0;
            simRunning = true;
            const btn = document.getElementById('sim-play-btn');
            if (btn) btn.innerHTML = '<i class="fa-solid fa-pause mr-1"></i>Tạm dừng';
            const allLessons = getAllLessonsFlat();
            const currentLesson = allLessons.find(l => l.id === appState.lessonId) || allLessons[0];
            const cfg = getSimConfig(currentLesson.simType);
            cfg.controls.forEach(c => {
                simParams[c.id] = c.val;
                const slider = document.getElementById(`ctrl-${c.id}`);
                const badge = document.getElementById(`val-${c.id}`);
                if (slider) slider.value = c.val;
                if (badge) badge.textContent = c.val;
            });
        }

        function initSimulationCanvas() {
            stopCurrentSimulation();
            const canvas = document.getElementById('physics-sim-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const allLessons = getAllLessonsFlat();
            const currentLesson = allLessons.find(l => l.id === appState.lessonId) || allLessons[0];
            const type = currentLesson.simType;

            function resizeCanvas() {
                if (!canvas.parentElement) return;
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = Math.max(320, Math.floor(rect.width));
                canvas.height = 340;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            let lastTs = performance.now();

            function loop(ts) {
                const dt = Math.min(0.05, (ts - lastTs) / 1000);
                lastTs = ts;
                if (simRunning) {
                    simTime += dt;
                }
                drawSimulationFrame(ctx, canvas.width, canvas.height, type, simTime, simParams);
                simAnimId = requestAnimationFrame(loop);
            }
            simAnimId = requestAnimationFrame(loop);
        }

        function drawSimulationFrame(ctx, W, H, type, t, p) {
            // Nền lưới phòng thí nghiệm hiện đại
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.1)';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
            }
            for (let y = 0; y < H; y += 30) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
            }

            ctx.font = '600 13px Inter, sans-serif';

            if (type === 'measure_length') {
                const lenCm = p.objLen || 8.5;
                const eyeOff = p.eyeOffset || 0;
                const startX = Math.max(40, W * 0.12);
                const pxPerCm = Math.min(42, (W - 100) / 15);
                const rulerY = 205;

                // Thước kẻ
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(startX - 10, rulerY, 15 * pxPerCm + 25, 55);
                ctx.strokeStyle = '#ca8a04';
                ctx.strokeRect(startX - 10, rulerY, 15 * pxPerCm + 25, 55);

                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 11px Inter, sans-serif';
                for (let i = 0; i <= 150; i++) {
                    const x = startX + (i / 10) * pxPerCm;
                    const hTick = i % 10 === 0 ? 22 : (i % 5 === 0 ? 15 : 9);
                    ctx.beginPath(); ctx.moveTo(x, rulerY); ctx.lineTo(x, rulerY + hTick); ctx.stroke();
                    if (i % 10 === 0) {
                        ctx.fillText(String(i / 10), x - 4, rulerY + 36);
                    }
                }

                // Vật cần đo
                const objW = lenCm * pxPerCm;
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(startX, rulerY - 38, objW, 34);
                ctx.strokeStyle = '#0284c7';
                ctx.strokeRect(startX, rulerY - 38, objW, 34);
                ctx.fillStyle = '#0f172a';
                ctx.fillText(`Vật mẫu (${lenCm} cm)`, startX + 10, rulerY - 17);

                // Vị trí mắt & tia nhìn
                const trueEndX = startX + objW;
                const eyeX = trueEndX + eyeOff * 28;
                const eyeY = 65;

                ctx.fillStyle = '#f8fafc';
                ctx.beginPath(); ctx.arc(eyeX, eyeY, 14, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#2563eb';
                ctx.beginPath(); ctx.arc(eyeX, eyeY + 3, 6, 0, Math.PI * 2); ctx.fill();

                ctx.setLineDash([5, 5]);
                ctx.strokeStyle = eyeOff === 0 ? '#4ade80' : '#f87171';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(eyeX, eyeY + 14);
                ctx.lineTo(trueEndX, rulerY - 38);
                const perceivedX = trueEndX - eyeOff * 12;
                ctx.lineTo(perceivedX, rulerY);
                ctx.stroke();
                ctx.setLineDash([]);

                const perceivedVal = Math.max(0, (lenCm - eyeOff * 0.35)).toFixed(2);
                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Chiều dài thực: ${lenCm} cm`, 24, 30);
                ctx.fillStyle = eyeOff === 0 ? '#4ade80' : '#f87171';
                ctx.fillText(
                    eyeOff === 0
                        ? `Đặt mắt vuông góc: Đọc chuẩn ${lenCm} cm ✓`
                        : `Đặt mắt lệch góc: Đọc sai thành ${perceivedVal} cm ✗`,
                    24, 52
                );

            } else if (type === 'measure_mass') {
                const m = p.mass || 450;
                const err = p.zeroErr || 0;
                const displayM = m + err;
                const cx = W / 2, cy = 195;

                // Thân cân đồng hồ
                ctx.fillStyle = '#e2e8f0';
                ctx.beginPath(); ctx.arc(cx, cy, 90, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 6; ctx.strokeStyle = '#3b82f6'; ctx.stroke();

                // Đĩa cân phía trên
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(cx - 8, cy - 115, 16, 25);
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(cx - 75, cy - 125, 150, 12);

                // Quả nặng đặt lên đĩa
                const boxSize = 26 + (m / 1000) * 30;
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(cx - boxSize / 2, cy - 125 - boxSize, boxSize, boxSize);
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 12px Inter, sans-serif';
                ctx.fillText(`${m}g`, cx - 16, cy - 125 - boxSize / 2 + 4);

                // Vạch chia mặt đồng hồ (0 -> 1000g)
                for (let g = 0; g < 1000; g += 50) {
                    const ang = -Math.PI / 2 + (g / 1000) * Math.PI * 2;
                    const r1 = g % 100 === 0 ? 68 : 74;
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = g % 100 === 0 ? 2 : 1;
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
                    ctx.lineTo(cx + Math.cos(ang) * 82, cy + Math.sin(ang) * 82);
                    ctx.stroke();
                }

                // Kim cân
                const needleAng = -Math.PI / 2 + (displayM / 1000) * Math.PI * 2;
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(needleAng) * 70, cy + Math.sin(needleAng) * 70);
                ctx.stroke();

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Khối lượng thực: ${m} g`, 24, 32);
                ctx.fillStyle = err === 0 ? '#4ade80' : '#fbbf24';
                ctx.fillText(`Số chỉ trên mặt cân: ${displayM} g (Sai số ban đầu: ${err > 0 ? '+' + err : err} g)`, 24, 54);

            } else if (type === 'measure_temp_time') {
                const c = p.tempC ?? 37;
                const f = (1.8 * c + 32).toFixed(1);
                const k = (c + 273).toFixed(0);
                const tx = W * 0.35;

                // Ống nhiệt kế
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(tx - 12, 45, 24, 220);
                ctx.beginPath(); ctx.arc(tx, 275, 22, 0, Math.PI * 2); ctx.fill();

                // Cột thủy ngân đỏ
                const fillH = (c / 100) * 195;
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(tx, 275, 16, 0, Math.PI * 2); ctx.fill();
                ctx.fillRect(tx - 6, 255 - fillH, 12, fillH + 15);

                // Vạch chia
                ctx.fillStyle = '#f8fafc';
                ctx.font = '12px Inter, sans-serif';
                for (let deg = 0; deg <= 100; deg += 20) {
                    const y = 255 - (deg / 100) * 195;
                    ctx.fillRect(tx + 14, y, 10, 2);
                    ctx.fillText(`${deg}°C`, tx + 30, y + 4);
                }

                // Bảng hiển thị 3 thang đo
                const bx = W * 0.55;
                ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
                ctx.fillRect(bx, 65, Math.min(250, W - bx - 20), 190);
                ctx.strokeStyle = '#38bdf8';
                ctx.strokeRect(bx, 65, Math.min(250, W - bx - 20), 190);

                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText('QUY ĐỔI THANG NHIỆT ĐỘ', bx + 16, 92);
                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 16px Inter, sans-serif';
                ctx.fillText(`• Celsius: ${c} °C`, bx + 16, 130);
                ctx.fillStyle = '#fbbf24';
                ctx.fillText(`• Fahrenheit: ${f} °F`, bx + 16, 168);
                ctx.fillStyle = '#4ade80';
                ctx.fillText(`• Kelvin: ${k} K`, bx + 16, 206);

            } else if (type === 'force_vector') {
                const f1 = p.fRight || 60;
                const f2 = p.fLeft || 20;
                const netF = f1 - f2;
                const shift = ((netF * t * 1.8) % (W - 220));
                let boxX = W / 2 - 40 + shift;
                if (boxX < 70) boxX = 70;
                if (boxX > W - 150) boxX = W - 150;
                const boxY = 175;

                // Mặt sàn
                ctx.fillStyle = '#334155';
                ctx.fillRect(30, boxY + 60, W - 60, 12);

                // Khối hộp
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(boxX, boxY, 80, 60);
                ctx.strokeStyle = '#93c5fd';
                ctx.strokeRect(boxX, boxY, 80, 60);
                ctx.fillStyle = '#ffffff';
                ctx.fillText('VẬT', boxX + 26, boxY + 35);

                // Mũi tên F1 (phải)
                if (f1 > 0) {
                    drawArrow(ctx, boxX + 80, boxY + 30, boxX + 80 + f1 * 1.4, boxY + 30, '#4ade80', `F₁ = ${f1} N`);
                }
                // Mũi tên F2 (trái)
                if (f2 > 0) {
                    drawArrow(ctx, boxX, boxY + 30, boxX - f2 * 1.4, boxY + 30, '#f87171', `F₂ = ${f2} N`);
                }

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Hợp lực tác dụng: F = ${Math.abs(netF)} N (${netF > 0 ? 'Hướng sang phải' : netF < 0 ? 'Hướng sang trái' : 'Cân bằng - Đứng yên'})`, 24, 34);

            } else if (type === 'spring_friction') {
                const m = p.hangMass || 200;
                const P = (m / 1000) * 10;
                const dL = (m / 100) * 24;
                const cx = W / 2;
                const topY = 45;
                const springLen = 80 + dL;

                // Giá đỡ
                ctx.fillStyle = '#64748b';
                ctx.fillRect(cx - 80, topY - 10, 160, 10);

                // Vẽ lò xo ziczac
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx, topY);
                const coils = 12;
                for (let i = 1; i <= coils; i++) {
                    const y = topY + (i / coils) * springLen;
                    const xOff = i === coils ? 0 : (i % 2 === 0 ? -14 : 14);
                    ctx.lineTo(cx + xOff, y);
                }
                ctx.stroke();

                // Quả nặng
                if (m > 0) {
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(cx - 24, topY + springLen, 48, 42);
                    ctx.fillStyle = '#0f172a';
                    ctx.fillText(`${m}g`, cx - 15, topY + springLen + 25);
                }

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Khối lượng vật treo: m = ${m} g = ${(m/1000).toFixed(2)} kg`, 24, 34);
                ctx.fillStyle = '#4ade80';
                ctx.fillText(`Trọng lượng P = 10m = ${P.toFixed(1)} N  |  Độ dãn lò xo Δl = ${(m/50).toFixed(1)} cm`, 24, 56);

            } else if (type === 'speed_motion') {
                const vKmh = p.speedKmh || 54;
                const vMs = vKmh / 3.6;
                const roadY = 220;
                const trackW = W - 120;
                const distM = (vMs * t) % 100;
                const carX = 50 + (distM / 100) * trackW;

                // Đường chạy & mốc mét
                ctx.fillStyle = '#334155';
                ctx.fillRect(40, roadY, W - 80, 16);
                ctx.fillStyle = '#94a3b8';
                for (let m = 0; m <= 100; m += 20) {
                    const mx = 50 + (m / 100) * trackW;
                    ctx.fillRect(mx, roadY, 2, 24);
                    ctx.fillText(`${m}m`, mx - 10, roadY + 38);
                }

                // Xe ô tô
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath(); ctx.roundRect(carX - 25, roadY - 32, 65, 26, 8); ctx.fill();
                ctx.fillStyle = '#0284c7';
                ctx.beginPath(); ctx.roundRect(carX - 12, roadY - 46, 38, 16, 6); ctx.fill();
                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.arc(carX - 10, roadY - 5, 8, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(carX + 26, roadY - 5, 8, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Tốc độ: v = ${vKmh} km/h = ${vMs.toFixed(1)} m/s`, 24, 34);
                ctx.fillStyle = '#fbbf24';
                ctx.fillText(`Thời gian t = ${(t % (100 / vMs)).toFixed(1)} s  |  Quãng đường s = ${distM.toFixed(1)} m`, 24, 56);

            } else if (type === 'st_graph') {
                const v1 = p.v1 || 60;
                const v2 = p.v2 || 30;
                const ox = 70, oy = H - 45;
                const gw = W - 130, gh = H - 90;

                // Trục tọa độ
                drawArrow(ctx, ox, oy, ox, 35, '#94a3b8', 's (km)');
                drawArrow(ctx, ox, oy, W - 40, oy, '#94a3b8', 't (giờ)');

                // Đồ thị Xe 1 (max t = 3h, max s = 240km)
                const xEnd = ox + gw;
                const y1 = oy - (Math.min(240, v1 * 3) / 240) * gh;
                const y2 = oy - (Math.min(240, v2 * 3) / 240) * gh;

                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(xEnd, y1); ctx.stroke();
                ctx.fillStyle = '#38bdf8'; ctx.fillText(`Xe 1 (v₁ = ${v1} km/h)`, xEnd - 125, y1 - 8);

                ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(xEnd, y2); ctx.stroke();
                ctx.fillStyle = '#fbbf24'; ctx.fillText(`Xe 2 (v₂ = ${v2} km/h)`, xEnd - 125, y2 - 8);

                ctx.fillStyle = '#f8fafc';
                ctx.fillText(`Đồ thị càng dốc thì tốc độ chuyển động của xe càng lớn`, 95, 32);

            } else if (type === 'sound_wave') {
                const freq = p.freq || 300;
                const amp = p.amp || 45;
                const midY = H / 2 + 15;

                ctx.strokeStyle = '#475569';
                ctx.beginPath(); ctx.moveTo(30, midY); ctx.lineTo(W - 30, midY); ctx.stroke();

                ctx.strokeStyle = '#34d399';
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let x = 30; x <= W - 30; x += 2) {
                    const phase = (x - 30) * (freq / 4500) - t * 8;
                    const y = midY - Math.sin(phase) * amp;
                    if (x === 30) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Tần số f = ${freq} Hz (${freq >= 450 ? 'Âm cao / bổng' : 'Âm trầm / thấp'})`, 24, 34);
                ctx.fillStyle = '#34d399';
                ctx.fillText(`Biên độ dao động A = ${amp} px (${amp >= 50 ? 'Âm to' : 'Âm nhỏ'})`, 24, 56);

            } else if (type === 'reflection_mirror') {
                const iDeg = p.incAngle || 40;
                const iRad = (iDeg * Math.PI) / 180;
                const ix = W / 2, iy = H - 70;
                const rayLen = 180;

                // Mặt gương phẳng
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(ix - 170, iy, 340, 10);
                // Đường pháp tuyến IN
                ctx.setLineDash([6, 6]);
                ctx.strokeStyle = '#94a3b8';
                ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ix, iy - 200); ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#94a3b8'; ctx.fillText('N (Pháp tuyến)', ix + 6, iy - 185);

                // Tia tới SI
                const sx = ix - Math.sin(iRad) * rayLen;
                const sy = iy - Math.cos(iRad) * rayLen;
                drawArrow(ctx, sx, sy, ix, iy, '#fbbf24', 'S (Tia tới)');

                // Tia phản xạ IR
                const rx = ix + Math.sin(iRad) * rayLen;
                const ry = iy - Math.cos(iRad) * rayLen;
                drawArrow(ctx, ix, iy, rx, ry, '#4ade80', 'R (Tia phản xạ)');

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Góc tới i = ${iDeg}°   |   Góc phản xạ i' = ${iDeg}°   |   Góc hợp bởi tia tới và tia phản xạ = ${iDeg * 2}°`, 24, 34);

            } else if (type === 'refraction_prism') {
                const iDeg = p.incI ?? 45;
                const n = p.refN || 1.3;
                const iRad = (iDeg * Math.PI) / 180;
                const sinR = Math.sin(iRad) / n;
                const rRad = Math.asin(Math.min(1, sinR));
                const rDeg = ((rRad * 180) / Math.PI).toFixed(1);

                const ix = W / 2, iy = H / 2 + 10;
                // Môi trường 2 (nước/thủy tinh)
                ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
                ctx.fillRect(30, iy, W - 60, H - iy - 20);
                ctx.strokeStyle = '#38bdf8';
                ctx.beginPath(); ctx.moveTo(30, iy); ctx.lineTo(W - 30, iy); ctx.stroke();

                // Pháp tuyến
                ctx.setLineDash([5, 5]); ctx.strokeStyle = '#94a3b8';
                ctx.beginPath(); ctx.moveTo(ix, iy - 130); ctx.lineTo(ix, iy + 130); ctx.stroke();
                ctx.setLineDash([]);

                // Tia tới
                const sx = ix - Math.sin(iRad) * 130;
                const sy = iy - Math.cos(iRad) * 130;
                drawArrow(ctx, sx, sy, ix, iy, '#fbbf24', 'Tia tới');

                // Tia khúc xạ
                const rx = ix + Math.sin(rRad) * 130;
                const ry = iy + Math.cos(rRad) * 130;
                drawArrow(ctx, ix, iy, rx, ry, '#4ade80', 'Tia khúc xạ');

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Góc tới i = ${iDeg}°  |  Chiết suất n = ${n}  |  Góc khúc xạ r = ${rDeg}°`, 24, 34);

            } else if (type === 'lens_optics') {
                const d = p.objDist || 25;
                const f = 15;
                const cx = W / 2, cy = H / 2 + 15;
                const scale = 6; // 1 cm = 6 px

                // Trục chính
                ctx.strokeStyle = '#64748b';
                ctx.beginPath(); ctx.moveTo(20, cy); ctx.lineTo(W - 20, cy); ctx.stroke();

                // Thấu kính hội tụ
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(cx, cy - 100); ctx.lineTo(cx, cy + 100); ctx.stroke();
                ctx.fillStyle = '#38bdf8';
                ctx.fillText('O', cx + 5, cy + 15);
                ctx.fillText('F', cx - f * scale - 4, cy + 16);
                ctx.fillText("F'", cx + f * scale - 4, cy + 16);

                // Vật AB
                const objX = cx - d * scale;
                const objH = 42;
                drawArrow(ctx, objX, cy, objX, cy - objH, '#fbbf24', 'B');

                if (d !== f) {
                    const dPrime = (d * f) / (d - f);
                    const imgX = cx + dPrime * scale;
                    const imgH = objH * (dPrime / d);
                    const clampedImgX = Math.max(30, Math.min(W - 30, imgX));
                    const clampedImgH = Math.max(-110, Math.min(110, imgH));

                    drawArrow(ctx, clampedImgX, cy, clampedImgX, cy + clampedImgH, d > f ? '#4ade80' : '#f472b6', "B'");

                    ctx.fillStyle = '#f8fafc';
                    ctx.font = 'bold 13px Inter, sans-serif';
                    ctx.fillText(`f = 15 cm | d = ${d} cm | d' = ${dPrime.toFixed(1)} cm (${d > f ? 'Ảnh thật, ngược chiều' : 'Ảnh ảo, cùng chiều, lớn hơn vật'})`, 24, 32);
                } else {
                    ctx.fillStyle = '#fbbf24';
                    ctx.fillText(`d = f = 15 cm: Chùm tia ló song song, ảnh ở vô cực`, 24, 32);
                }

            } else if (type === 'ohm_law') {
                const U = p.ohmU ?? 12;
                const R = p.ohmR || 20;
                const I = U / R;
                const P = U * I;

                const bx = W / 2 - 130, by = 95, bw = 260, bh = 160;
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
                ctx.strokeRect(bx, by, bw, bh);

                // Nguồn điện bên trái
                ctx.fillStyle = '#0f172a'; ctx.fillRect(bx - 15, by + 55, 30, 50);
                ctx.strokeStyle = '#fbbf24';
                ctx.beginPath(); ctx.moveTo(bx - 16, by + 70); ctx.lineTo(bx + 16, by + 70); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(bx - 8, by + 90); ctx.lineTo(bx + 8, by + 90); ctx.stroke();
                ctx.fillStyle = '#fbbf24'; ctx.fillText(`U = ${U} V`, bx - 75, by + 85);

                // Điện trở R bên trên
                ctx.fillStyle = '#1e293b'; ctx.fillRect(bx + 85, by - 16, 90, 32);
                ctx.strokeStyle = '#4ade80'; ctx.strokeRect(bx + 85, by - 16, 90, 32);
                ctx.fillStyle = '#4ade80'; ctx.fillText(`R = ${R} Ω`, bx + 104, by + 5);

                // Ampe kế bên phải
                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.arc(bx + bw, by + 80, 22, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#f472b6'; ctx.stroke();
                ctx.fillStyle = '#f472b6'; ctx.fillText('A', bx + bw - 5, by + 85);

                // Hạt điện tích chạy theo cường độ I
                if (I > 0) {
                    const speed = I * 45;
                    const perim = 2 * (bw + bh);
                    for (let k = 0; k < 10; k++) {
                        const pos = ((t * speed) + (k * perim) / 10) % perim;
                        let px = bx, py = by;
                        if (pos < bw) { px = bx + pos; py = by; }
                        else if (pos < bw + bh) { px = bx + bw; py = by + (pos - bw); }
                        else if (pos < 2 * bw + bh) { px = bx + bw - (pos - bw - bh); py = by + bh; }
                        else { px = bx; py = by + bh - (pos - 2 * bw - bh); }
                        ctx.fillStyle = '#fde047';
                        ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
                    }
                }

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Cường độ dòng điện: I = U / R = ${I.toFixed(2)} A  |  Công suất điện: P = U.I = ${P.toFixed(1)} W`, 24, 34);

            } else {
                // Mô phỏng tổng quát trực quan cho các chủ đề còn lại (Trái Đất - Mặt Trời, Áp suất, Đòn bẩy, Cảm ứng điện từ...)
                drawGenericPhysicsSim(ctx, W, H, type, t, p);
            }
        }

        function drawGenericPhysicsSim(ctx, W, H, type, t, p) {
            const cx = W / 2, cy = H / 2 + 15;
            if (type === 'solar_system') {
                const spd = p.orbitSpeed || 1;
                // Mặt Trời
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath(); ctx.arc(cx, cy, 32, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fef3c7'; ctx.fillText('Mặt Trời', cx - 25, cy + 48);

                // Quỹ đạo Trái Đất
                const rEarth = Math.min(115, W * 0.3);
                ctx.strokeStyle = 'rgba(148,163,184,0.35)';
                ctx.beginPath(); ctx.arc(cx, cy, rEarth, 0, Math.PI * 2); ctx.stroke();

                const angE = t * spd;
                const ex = cx + Math.cos(angE) * rEarth;
                const ey = cy + Math.sin(angE) * rEarth;
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath(); ctx.arc(ex, ey, 14, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#e0f2fe'; ctx.fillText('Trái Đất', ex - 22, ey - 20);

                // Mặt Trăng quay quanh Trái Đất
                const mx = ex + Math.cos(angE * 5) * 30;
                const my = ey + Math.sin(angE * 5) * 30;
                ctx.fillStyle = '#cbd5e1';
                ctx.beginPath(); ctx.arc(mx, my, 5, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText('Mô phỏng Trái Đất quay quanh Mặt Trời & Mặt Trăng quay quanh Trái Đất', 24, 34);

            } else if (type === 'density_sim' || type === 'pressure_archimedes') {
                const D = p.densityVal || 800;
                const waterTop = 120;
                ctx.fillStyle = 'rgba(14, 165, 233, 0.35)';
                ctx.fillRect(cx - 130, waterTop, 260, 180);
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
                ctx.strokeRect(cx - 130, waterTop, 260, 180);

                const isFloat = type === 'density_sim' ? D <= 1000 : false;
                const blockY = type === 'density_sim'
                    ? (isFloat ? waterTop - 25 + (D / 1000) * 50 : waterTop + 125)
                    : waterTop + Math.min(120, (p.depthH || 2) * 24);

                ctx.fillStyle = isFloat ? '#fbbf24' : '#94a3b8';
                ctx.fillRect(cx - 30, blockY, 60, 50);
                ctx.fillStyle = '#0f172a';
                ctx.fillText('VẬT', cx - 12, blockY + 30);

                ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 14px Inter, sans-serif';
                if (type === 'density_sim') {
                    const V = p.volLiters || 2;
                    const m = (D * V * 0.001).toFixed(2);
                    ctx.fillText(`D = ${D} kg/m³ | V = ${V} lít | Khối lượng m = ${m} kg (${isFloat ? 'Vật NỔI' : 'Vật CHÌM'})`, 24, 34);
                } else {
                    const h = p.depthH || 2;
                    const d = p.fluidD || 10000;
                    ctx.fillText(`Độ sâu h = ${h} m | d = ${d} N/m³ | Áp suất chất lỏng p = d.h = ${(d * h).toLocaleString()} Pa`, 24, 34);
                }

            } else if (type === 'lever_moment') {
                const f1 = 200, d1 = 45;
                const f2 = p.f2Val || 150;
                const d2 = p.d2Val || 60;
                const m1 = f1 * d1;
                const m2 = f2 * d2;
                const tilt = Math.max(-0.28, Math.min(0.28, (m2 - m1) / 18000));

                // Trụ đỡ điểm tựa O
                ctx.fillStyle = '#64748b';
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - 20, cy + 55); ctx.lineTo(cx + 20, cy + 55); ctx.closePath(); ctx.fill();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(tilt);
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(-150, -5, 300, 10);
                drawArrow(ctx, -d1 * 1.4, 5, -d1 * 1.4, 55, '#fbbf24', `F₁=${f1}N`);
                drawArrow(ctx, d2 * 1.4, 5, d2 * 1.4, 48, '#4ade80', `F₂=${f2}N`);
                ctx.restore();

                ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`M₁ = ${m1} N.cm  |  M₂ = ${m2} N.cm  (${m1 === m2 ? 'Đòn bẩy CÂN BẰNG ✓' : m2 > m1 ? 'Nghiêng phải' : 'Nghiêng trái'})`, 24, 34);

            } else if (type === 'mech_energy') {
                const h = p.dropH || 10;
                const m = p.objMass || 2;
                const wTotal = 10 * m * h;
                const prog = (Math.sin(t * 2) + 1) / 2;
                const curH = h * (1 - prog);
                const wt = 10 * m * curH;
                const wd = wTotal - wt;

                // Dốc nghiêng
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(80, 90); ctx.lineTo(80, 260); ctx.lineTo(W - 80, 260); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(80, 90); ctx.lineTo(W - 80, 260); ctx.stroke();

                const bx = 80 + prog * (W - 160);
                const by = 90 + prog * 170;
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath(); ctx.arc(bx, by - 12, 12, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 13px Inter, sans-serif';
                ctx.fillText(`Cơ năng W = ${wTotal} J  |  Thế năng W_t = ${wt.toFixed(0)} J  |  Động năng W_đ = ${wd.toFixed(0)} J`, 24, 34);

            } else if (type === 'em_induction') {
                const rpm = p.rpm ?? 2;
                const ang = t * rpm * 2.5;
                const inducedI = Math.cos(ang) * rpm;

                // Nam châm chữ U
                ctx.fillStyle = '#ef4444'; ctx.fillRect(cx - 110, cy - 55, 35, 110);
                ctx.fillStyle = '#ffffff'; ctx.fillText('N', cx - 98, cy + 5);
                ctx.fillStyle = '#3b82f6'; ctx.fillRect(cx + 75, cy - 55, 35, 110);
                ctx.fillStyle = '#ffffff'; ctx.fillText('S', cx + 88, cy + 5);

                // Khung dây quay
                const wCoil = Math.max(8, Math.abs(Math.sin(ang)) * 55);
                ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
                ctx.strokeRect(cx - wCoil / 2, cy - 40, wCoil, 80);

                ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Dòng điện cảm ứng xoay chiều: i = ${inducedI.toFixed(2)} A (${rpm === 0 ? 'Khung đứng yên -> i = 0' : 'Đang đổi chiều luân phiên'})`, 24, 34);

            } else {
                // Animation sóng / phân tử cho energy_transfer, magnet_field, circuit_basic, heat_transfer
                const val = Object.values(p)[0] || 50;
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
                ctx.beginPath();
                for (let x = 40; x < W - 40; x += 6) {
                    const y = cy + Math.sin(x * 0.03 + t * 4) * (25 + (val % 45));
                    if (x === 40) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`Mô phỏng trực quan thời gian thực • Thông số điều chỉnh: ${val}`, 24, 34);
            }
        }

        function drawArrow(ctx, x1, y1, x2, y2, color, label) {
            const headLen = 10;
            const angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();

            if (label) {
                ctx.font = 'bold 12px Inter, sans-serif';
                ctx.fillText(label, x2 + 6, y2 - 6);
            }
        }

        /**
         * =========================================================================
         * 9. NGÂN HÀNG LUYỆN TẬP: 20 CÂU TRẮC NGHIỆM + 4 CÂU TỰ LUẬN CÓ LỜI GIẢI
         * =========================================================================
         */
        function selectQuizOption(lessonId, qIdx, optIdx) {
            if (appState.quizSubmitted[lessonId]) return;
            if (!appState.quizAnswers[lessonId]) appState.quizAnswers[lessonId] = {};
            appState.quizAnswers[lessonId][qIdx] = optIdx;
            saveState();
            renderApp();
        }

        function submitLessonQuiz(lessonId) {
            appState.quizSubmitted[lessonId] = true;
            appState.completedLessons[lessonId] = true;
            saveState();
            renderApp();
            showToast('Đã nộp bài và chấm điểm tự động!', 'fa-award text-amber-400');
        }

        function resetLessonQuiz(lessonId) {
            appState.quizAnswers[lessonId] = {};
            appState.quizSubmitted[lessonId] = false;
            saveState();
            renderApp();
            showToast('Đã làm mới bài trắc nghiệm!', 'fa-rotate-right text-blue-400');
        }

        function toggleEssayAnswer(key) {
            appState.essayRevealed[key] = !appState.essayRevealed[key];
            renderApp();
        }

        function renderQuizTab(lesson) {
            const mcqs = buildQuizBank(lesson);
            const userAnswers = appState.quizAnswers[lesson.id] || {};
            const isSubmitted = !!appState.quizSubmitted[lesson.id];

            let correctCount = 0;
            if (isSubmitted) {
                mcqs.forEach((q, idx) => {
                    if (userAnswers[idx] === q.ans) correctCount++;
                });
            }
            const answeredCount = Object.keys(userAnswers).length;
            const score10 = ((correctCount / mcqs.length) * 10).toFixed(1);

            const letters = ['A', 'B', 'C', 'D'];

            return `
                <div class="space-y-6">
                    <!-- PHẦN I: 20 CÂU HỎI TRẮC NGHIỆM -->
                    <div class="bg-white rounded-3xl border border-slate-200/90 shadow-sm p-5 sm:p-7">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-5 mb-6 border-b border-slate-100">
                            <div>
                                <h2 class="text-lg sm:text-xl font-extrabold text-slate-900">
                                    Phần I. Trắc nghiệm khách quan (${mcqs.length} câu)
                                </h2>
                                <p class="text-xs sm:text-sm text-slate-500 mt-1">
                                    Đã chọn: <strong class="text-slate-800">${answeredCount}/${mcqs.length}</strong> câu • Chọn đáp án rồi nhấn Nộp bài để xem điểm và lời giải chi tiết.
                                </p>
                            </div>

                            <div class="flex items-center gap-2.5 shrink-0">
                                ${isSubmitted ? `
                                    <div class="px-4 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs sm:text-sm font-extrabold">
                                        Kết quả: ${correctCount}/${mcqs.length} (${score10} điểm)
                                    </div>
                                    <button onclick="resetLessonQuiz('${lesson.id}')" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-bold transition-all">
                                        <i class="fa-solid fa-rotate-right mr-1"></i>Làm lại
                                    </button>
                                ` : `
                                    <button onclick="submitLessonQuiz('${lesson.id}')" class="px-5 py-2.5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white text-xs sm:text-sm font-bold shadow-md transition-all">
                                        <i class="fa-solid fa-paper-plane mr-1.5"></i>Nộp bài & Chấm điểm
                                    </button>
                                `}
                            </div>
                        </div>

                        <div class="space-y-6">
                            ${mcqs.map((item, qIdx) => {
                                const chosen = userAnswers[qIdx];
                                return `
                                    <div class="p-4 sm:p-5 rounded-2xl bg-slate-50/70 border border-slate-200/80">
                                        <div class="flex items-start justify-between gap-2 mb-3">
                                            <div class="font-bold text-slate-900 text-sm sm:text-[15px] leading-relaxed">
                                                <span class="text-blue-600 mr-1">Câu ${qIdx + 1}:</span> ${item.q}
                                            </div>
                                            <span class="px-2.5 py-0.5 rounded-lg bg-slate-200/80 text-slate-600 text-[11px] font-semibold shrink-0">
                                                ${item.tag || 'Luyện tập'}
                                            </span>
                                        </div>

                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                            ${item.options.map((opt, oIdx) => {
                                                let btnStyle = 'bg-white border-slate-200 text-slate-700 hover:border-blue-400 hover:bg-blue-50/40';
                                                if (!isSubmitted && chosen === oIdx) {
                                                    btnStyle = 'bg-blue-600 border-blue-600 text-white font-semibold shadow-xs';
                                                } else if (isSubmitted) {
                                                    if (oIdx === item.ans) {
                                                        btnStyle = 'bg-emerald-600 border-emerald-600 text-white font-semibold';
                                                    } else if (chosen === oIdx && chosen !== item.ans) {
                                                        btnStyle = 'bg-rose-600 border-rose-600 text-white font-semibold';
                                                    } else {
                                                        btnStyle = 'bg-white border-slate-200 text-slate-500 opacity-75';
                                                    }
                                                }

                                                return `
                                                    <button onclick="selectQuizOption('${lesson.id}', ${qIdx}, ${oIdx})"
                                                        class="text-left p-3 rounded-xl border text-xs sm:text-sm transition-all flex items-start gap-2.5 ${btnStyle}">
                                                        <span class="font-extrabold shrink-0">${letters[oIdx]}.</span>
                                                        <span class="leading-snug">${opt}</span>
                                                    </button>
                                                `;
                                            }).join('')}
                                        </div>

                                        ${isSubmitted ? `
                                            <div class="mt-3 p-3.5 rounded-xl bg-amber-50 border border-amber-200/80 text-xs sm:text-sm text-slate-800 leading-relaxed">
                                                <strong class="text-amber-800"><i class="fa-solid fa-lightbulb mr-1"></i>Hướng dẫn giải:</strong> ${item.exp}
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- PHẦN II: 4 CÂU HỎI TỰ LUẬN CÓ ĐÁP ÁN CHI TIẾT -->
                    <div class="bg-white rounded-3xl border border-slate-200/90 shadow-sm p-5 sm:p-7">
                        <div class="mb-5 pb-4 border-b border-slate-100">
                            <h2 class="text-lg sm:text-xl font-extrabold text-slate-900">
                                Phần II. Câu hỏi Tự luận & Vận dụng (${lesson.essays.length} câu)
                            </h2>
                            <p class="text-xs sm:text-sm text-slate-500 mt-1">
                                Tự suy nghĩ trình bày lời giải ra giấy trước khi nhấn nút xem hướng dẫn đáp án chi tiết.
                            </p>
                        </div>

                        <div class="space-y-4">
                            ${lesson.essays.map((es, eIdx) => {
                                const key = `${lesson.id}_${eIdx}`;
                                const open = !!appState.essayRevealed[key];
                                const formattedAns = es.a.replace(/\n/g, '<br>');
                                return `
                                    <div class="p-4 sm:p-5 rounded-2xl bg-slate-50 border border-slate-200/80">
                                        <div class="font-bold text-slate-900 text-sm sm:text-[15px] leading-relaxed mb-3">
                                            <span class="text-indigo-600 mr-1">Bài tự luận ${eIdx + 1}:</span> ${es.q}
                                        </div>
                                        <button onclick="toggleEssayAnswer('${key}')"
                                            class="px-4 py-2 rounded-xl text-xs font-bold transition-all inline-flex items-center gap-2 ${open ? 'bg-slate-200 text-slate-800' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-xs'}">
                                            <i class="fa-solid ${open ? 'fa-eye-slash' : 'fa-eye'}"></i>
                                            <span>${open ? 'Ẩn lời giải chi tiết' : 'Xem hướng dẫn giải chi tiết'}</span>
                                        </button>
                                        ${open ? `
                                            <div class="mt-3 p-4 rounded-xl bg-white border border-indigo-200 text-xs sm:text-sm text-slate-800 leading-relaxed shadow-2xs">
                                                <div class="font-bold text-indigo-700 mb-1.5">Lời giải tham khảo:</div>
                                                <div>${formattedAns}</div>
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        /**
         * =========================================================================
         * 10. KHỞI CHẠY ỨNG DỤNG KHI TẢI XONG TRANG
         * =========================================================================
         */
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            domMathObserver.observe(document.body, { childList: true, subtree: true });
            renderApp();
        });
    </script>
</body>
